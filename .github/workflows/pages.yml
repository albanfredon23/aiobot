name: Site (GitHub Pages)

# Publie le site vitrine (web/) sur https://albanfredon23.github.io/aiobot/
# Le site construit est poussé sur la branche gh-pages, servie par GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Le site est servi sous /aiobot/ et non à la racine du domaine.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - name: Publication sur gh-pages
        working-directory: web/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Alban"
          git config user.email "329104919+albanfredon23@users.noreply.github.com"
          git add -A
          git commit -q -m "Site publié depuis ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
