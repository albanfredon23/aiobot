# En-têtes de sécurité (inclus dans chaque location : nginx n'hérite pas des add_header).
# CSP stricte : aucun script, style, police ou connexion hors de l'origine du site.
# Si vous activez un outil de mesure d'audience externe, ajoutez son domaine à script-src et connect-src.
# Derrière un proxy HTTPS, ajoutez-y Strict-Transport-Security.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
