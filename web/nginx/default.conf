# AIOBot : seul service exposé (HTTP 8080). Le moteur n'est joignable que par le réseau interne.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Documentation interactive de l'API : jamais publiée (elle charge des scripts externes).
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # API du moteur (même origine : pas de CORS). Le moteur limite lui-même le débit.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://aiobot-engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    # Missions de démonstration et fichiers versionnés par Vite.
    location /data/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

# Sonde de santé interne au conteneur, jamais publiée.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
