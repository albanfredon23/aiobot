[project]
name = "aiobot"
version = "0.1.0"
description = "Pilote industriel fondé sur un world model appris : filtre χ², gate de complexité, TAP, SCG, XAI Ledger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
