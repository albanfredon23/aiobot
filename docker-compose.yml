# AIOBot : deux services séparés, jamais un monolithe.
#   docker compose up --build        puis http://127.0.0.1:8080
#
#   aiobot-engine  world model, pilote et API ; image en bytecode seul, utilisateur
#                  non root, système de fichiers en lecture seule. Aucun port publié :
#                  il n'est joignable que par le réseau interne.
#   aiobot-web     site (nginx) ; seul service exposé. Sert le site et relaie /api/
#                  vers le moteur, ce qui active la démo « moteur en direct ».
name: aiobot

services:
  aiobot-engine:
    build:
      context: ./engine
      target: runtime
    restart: unless-stopped
    networks: [internal-net]
    environment:
      AIOBOT_METRICS_DIR: /data/metrics
    volumes:
      - metrics:/data/metrics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  aiobot-web:
    build: ./web
    restart: unless-stopped
    depends_on:
      aiobot-engine:
        condition: service_healthy
    networks: [internal-net, public-net]
    ports:
      - "${AIOBOT_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]  # nginx : processus maître root, workers non privilégiés
    security_opt:
      - no-new-privileges:true

networks:
  # Réseau interne : aucune sortie vers Internet pour le moteur.
  internal-net:
    internal: true
  public-net: {}

volumes:
  metrics:
